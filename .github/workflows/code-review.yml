name: Directory-Based Code Review Skills

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code-review-skills:
    name: Resolve & Union Directory Skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract Directory Skills & Generate Guidance
        run: |
          python .github/scripts/skill_reviewer.py \
            --base ${{ github.base_ref || 'main' }} \
            --output review_guidance.md

      - name: Publish Skills Summary to Step Summary
        run: |
          cat review_guidance.md >> $GITHUB_STEP_SUMMARY

      - name: Comment Guidance on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment $PR_NUMBER --body-file review_guidance.md || echo "Could not post PR comment"
