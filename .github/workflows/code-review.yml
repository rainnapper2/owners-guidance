name: Directory-Based Code Review Skills

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code-review-skills:
    name: Resolve & Union Directory Skills AI Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Step 1 - Extract Directory Skills & Union Context Payload
        run: |
          python skills/code-review-agent/scripts/review_agent.py \
            --base ${{ github.base_ref || 'main' }} \
            --output .review_context.tmp.md

      - name: Step 2 - Execute AI Code Reviewer Agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/ai_reviewer.py \
            --guidance .review_context.tmp.md \
            --base-sha ${{ github.event.pull_request.base.sha }} \
            --head-sha ${{ github.event.pull_request.head.sha }} \
            --base ${{ github.base_ref || 'main' }} \
            --pr ${{ github.event.pull_request.number }}

      - name: Step 3 - Publish Skills Summary to Action Job Summary
        run: |
          cat .review_context.tmp.md >> $GITHUB_STEP_SUMMARY
